[build-system]
requires = ['uv_build >= 0.11.21, <0.12.0']
build-backend = 'uv_build'

[project]
name = 'lightleak'
version = '0.1.0'
description = 'Film scanner tool.'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
urls.Source = 'https://github.com/agrif/lightleak/'

authors = [
    {name = 'Aaron Griffith', email = 'aargri@gmail.com'},
]

requires-python = ">=3.13"
dependencies = [
    "gphoto2~=2.6",
    "pillow~=12.3",
    "pypng~=0.20220715.0",
    "PySide6~=6.9",
    "rawpy~=0.27.0",
]

[project.scripts]
lightleak = 'lightleak.main:main'

[tool.uv.build-backend]
module-root = ''
